name: Build & Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build artifacts
        run: |
          echo "Copying public/ to dist/..."
          cp -r public dist
          echo "Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > dist/build-info.txt
          echo "Commit: ${{ github.sha }}" >> dist/build-info.txt
          echo "Contents:"
          find dist -type f | sort

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.148.0 pages deploy dist --project-name=smartergpt --branch=production

      - name: Deployment summary
        run: |
          echo "### Deployed to Cloudflare Pages :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
